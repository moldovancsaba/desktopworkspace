name: DesktopWorkspace
options:
  bundleIdPrefix: com.moldovancsaba
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "3"
    PRODUCT_NAME: DesktopWorkspace
    SWIFT_VERSION: "5.9"
targets:
  DesktopWorkspace:
    type: application
    platform: macOS
    sources:
      - path: Sources/DesktopWorkspace
      - path: Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/DesktopWorkspace-AppStore.entitlements
        ENABLE_APP_SANDBOX: YES
        DEVELOPMENT_TEAM: GZE5C5C4L8
        PRODUCT_BUNDLE_IDENTIFIER: com.moldovancsaba.DesktopWorkspace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  DesktopWorkspace:
    build:
      targets:
        DesktopWorkspace: all
    archive:
      config: Release

name: DesktopWorkspace
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: "Desktop Workspace"
    SWIFT_VERSION: "5.9"
targets:
  DesktopWorkspace:
    type: application
    platform: macOS
    sources:
      - path: Sources/DesktopWorkspace
      - path: Resources/Assets.xcassets
    entitlements:
      path: Resources/DesktopWorkspace-AppStore.entitlements
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.local.DesktopWorkspace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  DesktopWorkspace:
    build:
      targets:
        DesktopWorkspace: all
    archive:
      config: Release
